name: Build Minecraft Mod

on:
  push:
    paths:
      - 'minecraft-mod/**'
      - '.github/workflows/build-mod.yml'
  pull_request:
    paths:
      - 'minecraft-mod/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: music-mod-1.21.1
          path: minecraft-mod/build/libs/*.jar
